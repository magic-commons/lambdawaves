plugins { id 'com.android.application' }

android {
    namespace 'com.magiccommons.lambdawaves.webview'
    compileSdk 36
    defaultConfig {
        applicationId 'com.magiccommons.lambdawaves.webview'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1-proof'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'     // WebViewAssetLoader
    implementation 'androidx.activity:activity:1.9.0'  // ComponentActivity, result launchers, back dispatcher
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')  // aligns stdlib-jdk7/jdk8 (else: duplicate kotlin classes)
}
