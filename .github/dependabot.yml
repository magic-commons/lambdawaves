# 030 V (finding 13): Dependabot watches the one dev dependency (wrangler) and the two pinned actions. Alerts only arrive as pull
# requests; nothing merges on its own, and main is protected.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
