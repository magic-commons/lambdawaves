# The node half of the gate on every push and pull request: the maths, the file laws, the PWA integrity.
# The browser half (a real Firefox with WebGPU) runs on a machine with a GPU — see README "The gate".
name: gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm test
