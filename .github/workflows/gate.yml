# The node half of the gate on every push and pull request: the maths, the file laws, the PWA integrity.
# The browser half (a real Firefox with WebGPU) runs on a machine with a GPU — see README "The gate".
name: gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm test
