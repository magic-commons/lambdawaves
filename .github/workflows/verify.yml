name: Verify source and release assets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0              # tools/changelog.mjs reads the tags and the wave headings at each one
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: bash test.sh node
      - run: node tools/build-deploy.mjs --quiet
      - run: node tools/changelog.mjs --check   # 028 R-27: CHANGELOG in step; CITATION.cff = BUILD_LINE; newest heading = newest tag
      - run: npx --no-install wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: git diff --exit-code
