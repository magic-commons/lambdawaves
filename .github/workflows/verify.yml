name: Verify source and release assets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # tools/changelog.mjs reads the tags and the wave headings at each one
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=high
      - run: bash test.sh node
      - run: node tools/build-deploy.mjs --quiet
      - run: node tools/changelog.mjs --check   # 028 R-27: CHANGELOG in step; CITATION.cff = BUILD_LINE; newest heading = newest tag
      - run: npx --no-install wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: git diff --exit-code
